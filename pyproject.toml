[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bayora"
version = "0.1.0"
description = "Adversarial AI safety toolkit: red-team test harness, runtime guardrails and a results dashboard for LLM applications."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["llm", "ai-safety", "red-teaming", "prompt-injection", "guardrails", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["ruff>=0.5"]

[project.scripts]
bayora = "bayora.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bayora = [
  "attacks/library/*.yaml",
  "guardrails/*.yaml",
  "server/static/*",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E731"]
